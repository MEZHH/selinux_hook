name: Build KernelPatch Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Inspect Repository Files
        run: |
          echo "=== Directory Structure ==="
          ls -la
          echo "=== KernelPatch Submodule Check ==="
          ls -la KernelPatch || echo "KernelPatch directory missing"

      - name: Build Module with NDK
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          export NDK=$ANDROID_NDK_LATEST_HOME
          export PATH=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          
          # Attempt build and output build logs
          make ARCH=arm64 || make

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selinux_hook_kpm
          path: |
            *.kpm
            *.so
            out/
          if-no-files-found: warn
