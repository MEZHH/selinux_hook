name: Build KernelPatch Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build Module with NDK
        run: |
          # Set NDK environment variables for standard KernelPatch Makefiles
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          export NDK=$ANDROID_NDK_LATEST_HOME
          export PATH=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          
          # Run make to compile the KernelPatch module
          make clean || true
          make

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selinux_hook_kpm
          path: |
            *.kpm
            out/
