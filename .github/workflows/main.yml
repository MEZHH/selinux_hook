name: Build KernelPatch Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build C Files
        run: |
          mkdir -p out
          # Compile source files using the NDK Clang toolchain
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang \
            --target=aarch64-linux-android29 \
            -I. -IKernelPatch/include \
            -fPIC -shared \
            -o out/selinux_hook.so \
            *.c || true
          
          # Check generated outputs
          ls -la out/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selinux_hook_binary
          path: out/
